<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09090B">
  <meta name="robots" content="noindex">
  <title>Acompanhe seu veículo · MGT Auto Elétrica</title>
  <meta property="og:title" content="Acompanhe seu veículo · MGT Auto Elétrica">
  <meta property="og:description" content="Veja o andamento do serviço e o orçamento em tempo real.">
  <meta property="og:image" content="assets/icon-512.png">
  <link rel="icon" href="assets/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
  <style>
    .tl { display: flex; flex-direction: column; }
    .tl div { display: flex; align-items: center; gap: 12px; padding: 7px 0; }
    .tl i { width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0; box-sizing: border-box; border: 2px solid #3F3F46; display: flex; align-items: center; justify-content: center; color: var(--bg); }
    .tl i svg { width: 12px; height: 12px; }
    .tl .feito i { background: var(--y); border-color: var(--y); }
    .tl .agora i { border-color: var(--or); }
    .tl .agora span { color: var(--or); font-weight: 600; }
    .tl .depois span { color: var(--dim); }
    .tl span { flex: 1; font-size: 14px; }
    .tl em { font-style: normal; font-family: var(--mono); font-size: 12px; color: var(--dim); }
    .galeria { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .galeria img { width: 100%; height: 130px; object-fit: cover; border-radius: 16px; background: var(--s2); }
  </style>
</head>
<body>
  <div id="app"><div class="carregando"></div></div>
  <script type="module" src="cliente.js"></script>
</body>
</html>
